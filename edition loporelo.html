<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Édition .Dé.pliable Interactive</title>
    <style>
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            font-size: 10pt;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
        }

        h2 {
            margin: 5px;
            color: #333;
        }

        #grid {
            width: 90vw;
            height: 70vh;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 20px;
        }

        .image-container {
            width: 100%;
            height: 100%;
            position: relative;
            transition: opacity 0.8s ease;
            opacity: 0;
        }

        img {
            width: 80%;
            height: 90%;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        /* Effet de zoom pour les images dans la grille */
        .image-container img:hover {
            transform: scale(1.1);  /* Zoom à 10% */
            transition: transform 0.3s ease-in-out;  /* Transition fluide */
        }

        /* Affichage plein écran */
        #lightbox {
            display: none; /* Le lightbox est caché au démarrage */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #lightbox img {
            max-width: 60vw;
            max-height: 60vh;
            border-radius: 12px;
            transform: none;  /* Pas de zoom sur les images du carrousel */
        }

        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-button:hover {
            color: #ddd;
        }

        #prev { left: 10px; }
        #next { right: 10px; }
        #close { top: 20px; right: 20px; font-size: 30px; }
    </style>
</head>
<body>

    <h2>Édition Dépliable Interactive</h2>
    <div id="grid"></div>

    <!-- Affichage plein écran -->
    <div id="lightbox">
        <button id="close" class="nav-button">✖</button>
        <button id="prev" class="nav-button">◀</button>
        <img id="lightbox-img" src="">
        <button id="next" class="nav-button">▶</button>
    </div>

    <script>
        let imageList = [
            "loporelo en ligne-3.jpg", "loporelo en ligne-4.jpg", "loporelo en ligne-5.jpg",
            "loporelo en ligne-6.jpg", "loporelo en ligne-7.jpg", "loporelo en ligne-8.jpg",
            "loporelo en ligne-9.jpg", "loporelo en ligne-11.jpg", "loporelo en ligne-12.jpg",
            "loporelo en ligne-13.jpg", "loporelo en ligne-14.jpg", "loporelo en ligne-15.jpg",
            "loporelo en ligne-16.jpg", "loporelo en ligne-17.jpg", "loporelo en ligne-18.jpg",
            "loporelo en ligne-19.jpg", "loporelo en ligne-20.jpg", "loporelo en ligne-21.jpg",
            "loporelo en ligne-22.jpg", "loporelo en ligne-23.jpg", "loporelo en ligne-24.jpg",
            "loporelo en ligne-25.jpg", "loporelo en ligne-26.jpg", "loporelo en ligne-4.jpg"
        ]; 

        let grid = document.getElementById("grid");
        let lightbox = document.getElementById("lightbox");
        let lightboxImg = document.getElementById("lightbox-img");
        let prevBtn = document.getElementById("prev");
        let nextBtn = document.getElementById("next");
        let closeBtn = document.getElementById("close");
        
        let imageIndex = 0;

        closeBtn.addEventListener("click", () => lightbox.style.display = "none");
        prevBtn.addEventListener("click", showPrevImage);
        nextBtn.addEventListener("click", showNextImage);

        // Cacher le carrousel au chargement de la page
        window.onload = function() {
            lightbox.style.display = "none";  // Assure que le carrousel est caché
            addImages();
        };

        function addImages() {
            imageList.forEach((src, index) => {
                setTimeout(() => {
                    let imgContainer = document.createElement("div");
                    imgContainer.className = "image-container";
                    imgContainer.style.opacity = "0";

                    let img = document.createElement("img");
                    img.src = src;
                    img.setAttribute("data-index", index);
                    img.addEventListener("click", openLightbox);

                    imgContainer.appendChild(img);
                    grid.appendChild(imgContainer);

                    setTimeout(() => imgContainer.style.opacity = "1", 100);
                }, index * 300);
            });
        }

        function openLightbox(event) {
            let index = parseInt(event.target.getAttribute("data-index"));
            showImage(index);
            lightbox.style.display = "flex";  // Affiche le carrousel seulement après un clic sur une image
        }

        function showImage(index) {
            if (index < 0) index = imageList.length - 1;
            if (index >= imageList.length) index = 0;
            lightboxImg.src = imageList[index];
            lightboxImg.setAttribute("data-index", index);
        }

        function showPrevImage() {
            let currentIndex = parseInt(lightboxImg.getAttribute("data-index"));
            showImage(currentIndex - 1);
        }

        function showNextImage() {
            let currentIndex = parseInt(lightboxImg.getAttribute("data-index"));
            showImage(currentIndex + 1);
        }
    </script>

</body>
</html>
